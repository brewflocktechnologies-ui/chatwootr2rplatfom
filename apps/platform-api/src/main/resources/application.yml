# All secrets come from environment variables (names frozen in docs/architecture/api-contract.md).
# No defaults for secrets: the application refuses to start when one is missing.
spring:
  application:
    name: platform-api
  datasource:
    url: ${PLATFORM_DB_URL}
    username: ${PLATFORM_DB_USER}
    password: ${PLATFORM_DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 3MB
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  address: 127.0.0.1
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

tenant:
  key: ${TENANT_KEY}

chatwoot:
  base-url: ${CHATWOOT_BASE_URL}
  account-id: ${CHATWOOT_ACCOUNT_ID}
  inbox-id: ${CHATWOOT_INBOX_ID}
  team-id: ${CHATWOOT_TEAM_ID}
  agent-bot-id: ${CHATWOOT_AGENT_BOT_ID}
  api-token: ${CHATWOOT_API_TOKEN}
  bot-access-token: ${CHATWOOT_BOT_ACCESS_TOKEN}
  bot-secret: ${CHATWOOT_BOT_SECRET}
  website-token: ${CHATWOOT_WEBSITE_TOKEN}
  # Browser-reachable Chatwoot URL for the demo page only. Server-side calls use base-url.
  public-base-url: ${CHATWOOT_PUBLIC_BASE_URL:http://localhost:3100}
  connect-timeout: 3s
  read-timeout: 10s

ollama:
  base-url: ${OLLAMA_BASE_URL}

r2r:
  base-url: ${R2R_BASE_URL}
  service-email: ${R2R_SERVICE_EMAIL}
  service-password: ${R2R_SERVICE_PASSWORD}
  collection-id: ${R2R_COLLECTION_ID}
  connect-timeout: 3s
  # Local generation on an 8 GB GPU can take tens of seconds.
  read-timeout: 120s

platform:
  admin-api-key: ${PLATFORM_ADMIN_API_KEY}

agent:
  # Measured on the pinned stack (see apps/platform-api/README-backend.md): in-domain top scores 0.56-0.73,
  # out-of-domain 0.23-0.44. 0.50 separates them with margin on the fictional policy.
  evidence-min-score: ${AGENT_EVIDENCE_MIN_SCORE:0.50}
  model: ${AI_MODEL:ollama/llama3.2:3b}
  embedding-model: mxbai-embed-large
  retrieval-limit: 4

worker:
  enabled: true
  poll-interval-ms: 500
  max-attempts: 5
  lease: 2m
  retry-base: 2s
