# Managed-local, PINNED R2R profile (v3.6.5) for the Acme Demo MVP.
# Derived from upstream docker/compose.yaml at tag v3.6.5 (postgres + r2r services only).
# Hatchet, Unstructured, graph clustering, MinIO and the R2R dashboard are intentionally NOT included.
# Own Compose project name and volumes. Loopback-only ports. Requires config/r2r.local.toml (generated).
name: saas-r2r

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${R2R_POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${R2R_POSTGRES_PASSWORD:?set in infra/r2r/.env}
      - POSTGRES_DB=${R2R_POSTGRES_DBNAME:-r2r}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${R2R_POSTGRES_USER:-postgres} -d ${R2R_POSTGRES_DBNAME:-r2r}"]
      interval: 5s
      timeout: 3s
      retries: 30

  r2r:
    image: sciphiai/r2r:3.6.5
    restart: unless-stopped
    env_file: .env
    environment:
      - R2R_HOST=0.0.0.0
      - R2R_PORT=7272
      - R2R_CONFIG_PATH=/app/config/r2r.toml
      - R2R_POSTGRES_HOST=postgres
      - R2R_POSTGRES_PORT=5432
      - R2R_POSTGRES_USER=${R2R_POSTGRES_USER:-postgres}
      - R2R_POSTGRES_DBNAME=${R2R_POSTGRES_DBNAME:-r2r}
    ports:
      - "127.0.0.1:${R2R_PORT:-7272}:7272"
    volumes:
      - ./config/r2r.local.toml:/app/config/r2r.toml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7272/v3/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  postgres_data:
    name: saas-r2r_postgres_data
