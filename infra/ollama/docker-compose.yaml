# Local model runtime for the Acme Demo MVP. No hosted inference: all generation/embeddings stay on this machine.
name: saas-ollama

services:
  ollama:
    image: ollama/ollama:0.40.17
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_KEEP_ALIVE=10m
      - OLLAMA_NUM_PARALLEL=2
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  models:
    name: saas-ollama_models
